# Спецификация HTTP API NeuroDent — источник истины (ADR-0002).
# Изменение API: правка этого файла → make generate → реализация.
# Каждая операция помечена тегом модуля: код генерируется отдельно для
# каждого тега, в пакет внутри модуля (ADR-0013).
openapi: 3.0.3
info:
  title: NeuroDent API
  version: 0.1.0
  description: |
    Ошибки всех операций — application/problem+json (RFC 9457, ADR-0006):
    поле code — машиночитаемая категория, request_id — связь с логами.
tags:
  - name: platform
    description: Служебные эндпоинты платформы (пробы оркестратора).
paths:
  /healthz:
    get:
      tags: [platform]
      operationId: getHealthz
      summary: Liveness — процесс жив
      description: "Не проверяет зависимости: сбой БД не должен приводить к перезапуску пода."
      responses:
        "200":
          description: Процесс отвечает.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}
        default: {$ref: "#/components/responses/Problem"}
  /readyz:
    get:
      tags: [platform]
      operationId: getReadyz
      summary: Readiness — можно слать трафик
      description: 503 во время остановки (draining) и при недоступных зависимостях (unavailable).
      responses:
        "200":
          description: Готов принимать трафик.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}
        "503":
          description: Не готов.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}
        default: {$ref: "#/components/responses/Problem"}
components:
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, draining, unavailable]
    Problem:
      type: object
      description: RFC 9457. Для 5xx detail всегда общий, внутренних деталей нет.
      required: [type, title, status, code]
      properties:
        type: {type: string, example: about:blank}
        title: {type: string, example: Not Found}
        status: {type: integer, example: 404}
        detail: {type: string}
        code:
          type: string
          description: Категория ошибки (invalid, not_found, conflict, unauthenticated, forbidden, rate_limited, unavailable, internal) или код транспорта (method_not_allowed, payload_too_large).
        request_id: {type: string}
  responses:
    Problem:
      description: Ошибка в формате RFC 9457.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
